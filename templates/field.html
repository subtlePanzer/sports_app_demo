<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Field Event</title>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1 id="event-title">Field event</h1>
        <div>
            <label for="station-select">Station:</label>
            <select id="station-select"></select>
            <button id="load-next-scheduled">Load Next Scheduled Event</button>
        </div>
    </div>

    <h2 id="student-name">Loading...</h2>
    <div id="student-house" style="display:inline-block; margin-top:0.25rem; margin-bottom:1rem; padding:0.3rem 0.75rem; border-radius:999px; font-weight:600; color:white; background:#6b7280;">House</div>

    <div id="controls" style="margin-bottom:1rem;">
        <button id="prev-student">&larr; Previous</button>
        <button id="mark-absent">Mark Not in Attendance</button>
        <button id="next-student">Next &rarr;</button>
    </div>

    <form id="result-form">
        <div style="margin-bottom: 1rem;">
            <label for="result">Result (m)</label><br>
            <input type="number" id="result" name="result" step="0.01" placeholder="12.34" min="0" max="100">
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>

    <div id="progress" style="margin-top:1rem;"></div>

    <script src="{{ url_for('static', filename='field.js') }}"></script>
</body>
</html>
